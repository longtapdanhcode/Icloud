<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | Cloud Inventory</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.05);
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      border-radius: 6px;
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .btn-login {
      background-color: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
      font-weight: 500;
      border-radius: 6px;
    }

    .btn-login:hover {
      background-color: #1e293b;
      border-color: #1e293b;
      color: #ffffff;
    }

    .form-control {
      border-radius: 6px;
      font-size: 0.9rem;
      border-color: #cbd5e1;
    }

    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }
  </style>
</head>

<body>
  <main class="container px-3">

    <!-- Giao diện đăng nhập -->
    <section id="loginView" class="card login-card mx-auto">
      <div class="card-body p-4 p-md-5">

        <div class="brand-icon">C</div>

        <h1 class="h3 text-center fw-bold mb-2">
          Cloud Inventory
        </h1>

        <p class="text-secondary text-center mb-4">
          Đăng nhập vào hệ thống quản lý kho
        </p>

        <div id="loginMessage" class="alert d-none" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">
              Email
            </label>

            <input type="email" id="email" class="form-control form-control-lg" placeholder="Nhập email của bạn"
              autocomplete="username" required>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">
              Mật khẩu
            </label>

            <input type="password" id="password" class="form-control form-control-lg" placeholder="Nhập mật khẩu"
              autocomplete="current-password" required>
          </div>

          <button id="loginButton" type="submit" class="btn btn-login w-100 py-2">
            Đăng nhập
          </button>
        </form>

        <p class="text-secondary text-center small mt-4 mb-0">
          Cloud Inventory · Hệ thống quản lý tồn kho
        </p>
      </div>
    </section>

    <!-- Giao diện sau khi đăng nhập thành công -->
    <section id="appView" class="card login-card mx-auto d-none">
      <div class="card-body p-4 p-md-5">

        <div class="brand-icon">C</div>

        <h1 class="h3 text-center fw-bold mb-2">
          Đăng nhập thành công
        </h1>

        <p class="text-secondary text-center">
          Chào mừng bạn đến với Cloud Inventory
        </p>

        <hr>

        <p class="mb-2">
          <strong>Họ tên:</strong>
          <span id="userName">—</span>
        </p>

        <p class="mb-2">
          <strong>Email:</strong>
          <span id="userEmail">—</span>
        </p>

        <p class="mb-4">
          <strong>Vai trò:</strong>
          <span id="userRole" class="badge text-bg-primary">
            —
          </span>
        </p>

        <div class="d-grid gap-2 mb-3">
          <a href="/products.html" class="btn btn-primary">
            Quản lý Sản phẩm
          </a>
          <a href="/categories.html" class="btn btn-outline-primary">
            Quản lý Danh mục
          </a>
        </div>

        <button id="logoutButton" class="btn btn-outline-danger w-100">
          Đăng xuất
        </button>
      </div>
    </section>

  </main>

  <script src="/js/common/api.js"></script>
  <script src="/js/auth.js"></script>
</body>

</html>

name: Smoke test (production)

# Không chạy khi push: Render chỉ deploy sau khi mọi check của commit xanh,
# nếu workflow này chờ bản deploy mới thì hai bên sẽ chờ nhau mãi.
on:
  workflow_dispatch:
    inputs:
      expect_version:
        description: 'Commit mong đợi ở /health (để trống = không kiểm tra)'
        required: false
  schedule:
    # 01:00 UTC = 08:00 giờ Việt Nam, mỗi ngày
    - cron: '0 1 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.PRODUCTION_URL || 'https://cloud-inventory-ruyb.onrender.com' }}
      SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
      EXPECT_VERSION: ${{ inputs.expect_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/smoke.js
